<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e8c">
<meta name="description" content="Área urbana e vias transitáveis dos 39 municípios de PE do CONIAPE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIS Comercial">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GIS Comercial · Pernambuco</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="manual.css">
<link rel="stylesheet" href="base.css">
<script src="manual.js"></script>
<script src="data.js?v=45ea6b44"></script>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --sunk:#f6f8fa; --ink:#18212b; --ink-2:#3d4955; --muted:#6b7785; --line:#e3e7ec;
  --accent:#0f6e8c; --accent-ink:#ffffff; --accent-soft:#e3f1f5; --hover:#f0f5f8;
  --c1:#dcecf1; --c2:#a3d0dc; --c3:#5aacc4; --c4:#217f9e; --c5:#0b4a63;
  --off-fill:#c9d0d8; --off-line:#a7b0ba; --urb:#e8762c; --via:#c0392b; --sel:#111a22;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --sunk:#1d242d; --ink:#e8edf2; --ink-2:#c3ccd6; --muted:#8e9aa8; --line:#28313c;
    --accent:#4fb3cf; --accent-ink:#06171d; --accent-soft:#16323b; --hover:#1f2731;
    --off-fill:#55606c; --off-line:#6b7682; --sel:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --sunk:#1d242d; --ink:#e8edf2; --ink-2:#c3ccd6; --muted:#8e9aa8; --line:#28313c;
  --accent:#4fb3cf; --accent-ink:#06171d; --accent-soft:#16323b; --hover:#1f2731;
  --off-fill:#55606c; --off-line:#6b7682; --sel:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabeçalho ---------- */
header{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:15.5px;margin:0;font-weight:680;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
aside{width:400px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-height:0;background:var(--bg)}

/* ---------- resumo ---------- */
.summary{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:9px 11px}
.kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.kpi span{color:var(--muted);font-size:11.5px}

/* ---------- ferramentas ---------- */
.tools{padding:12px 18px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.field{position:relative}
.field svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.tools input,.tools select{width:100%;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.tools input{padding-left:32px}
.tools label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tools label select{flex:1}

/* ---------- views ---------- */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
aside.detail-open .summary,aside.detail-open .tools{display:none}

/* lista */
.listhead{display:grid;grid-template-columns:28px 1fr 118px;gap:8px;padding:8px 18px;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.listhead button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.listhead button:hover,.listhead button.on{color:var(--accent)}
.listhead .r{justify-self:end}
.list{overflow:auto;flex:1}
.row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:28px 1fr 118px;gap:8px;align-items:center;padding:8px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .rk{color:var(--muted);font-size:12px}
.row .nm{font-weight:560;line-height:1.25}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.row .val{text-align:right;font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--sunk);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c4);border-radius:2px}
.empty{padding:28px 18px;color:var(--muted);text-align:center}

/* detalhe */
.dscroll{overflow:auto;flex:1;padding:12px 18px 18px}
.dtop{display:flex;align-items:center;justify-content:space-between;margin:-4px -8px 6px}
.dtitle h2{font-size:20px;margin:0;letter-spacing:-.01em}
.dtitle p{margin:2px 0 14px;color:var(--muted);font-size:12.5px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hero div{border-radius:12px;padding:12px;background:var(--accent-soft)}
.hero span{display:block;font-size:12px;color:var(--ink-2)}
.hero b{display:block;font-size:22px;font-weight:720;letter-spacing:-.01em;margin:2px 0}
.hero small{color:var(--muted);font-size:11.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.stats div{padding:9px 12px;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){border-right:1px solid var(--line)}
.stats div:nth-last-child(-n+2){border-bottom:0}
.stats span{display:block;color:var(--muted);font-size:11.5px}
.stats b{font-weight:620}
h3{font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.dist{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.dist th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:0 0 6px;border-bottom:1px solid var(--line)}
.dist th:first-child,.dist td:first-child{text-align:left}
.dist td{padding:6px 0;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.dist td:first-child{padding-right:10px}
.dist .bar{margin-top:4px}
.dist tfoot td{font-weight:650;border-bottom:0}
.dist tbody tr{cursor:pointer}
.dist tbody tr:hover td{background:var(--hover)}
.dist tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dist tbody tr.sel td{background:var(--accent-soft);color:var(--ink);font-weight:620}
.dist tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.dist td:first-child{padding-left:6px}
.dist .zi{width:13px;height:13px;color:var(--accent);vertical-align:-2px;margin-right:6px;opacity:.75}
.note{color:var(--muted);font-size:11.5px;margin:4px 0 0}
.alert{border:1px solid #e6b450;background:color-mix(in srgb,#e6b450 14%,var(--panel));border-radius:10px;padding:9px 11px;font-size:12px;margin:0 0 12px;color:var(--ink-2)}
.alert b{color:var(--ink)}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel)}
.dfoot .btn{flex:1}

/* ---------- mapa ---------- */
.leaflet-container{font:inherit}
.leaflet-bar a,.leaflet-control-layers{background:var(--panel);color:var(--ink);border-color:var(--line)!important}
.leaflet-control-layers-expanded{padding:8px 12px;font-size:12.5px}
.legend{background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);font-size:12px;min-width:184px;overflow:hidden}
.legend .lh{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;font-weight:650;cursor:pointer}
.legend .lh svg{width:14px;height:14px;transition:transform .15s}
.legend.closed .lh svg{transform:rotate(180deg)}
.legend.closed .lb{display:none}
.legend .lb{padding:0 11px 10px}
.legend .ramp{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:3px}
.legend .ramp i{height:10px}
.legend .ramp i:first-child{border-radius:3px 0 0 3px}.legend .ramp i:last-child{border-radius:0 3px 3px 0}
.legend .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-bottom:8px}
.legend .it{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--ink-2)}
.legend .sw{width:16px;height:11px;border-radius:2px;flex:none}
.mlabel{background:transparent;border:0;box-shadow:none;padding:0;font-size:11px;font-weight:650;color:#13202a;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.mlabel::before{display:none}
.tip b{font-size:13px}.tip span{color:#5b6670}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999}
.toast.on{opacity:.95}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px;max-width:430px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,22,.45)}
dialog h3{margin:0 0 4px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
dialog p{margin:0 0 14px;color:var(--muted);font-size:13px}
dialog label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
dialog label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
dialog label small{display:block;color:var(--muted);margin-top:1px}
dialog .rowb{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ---------- janela do manual ---------- */
dialog.manual{max-width:none;width:min(980px,calc(100% - 24px));height:min(90vh,1000px);padding:0;display:none;flex-direction:column;overflow:hidden}
dialog.manual[open]{display:flex}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.mhead > b{font-size:15px}
.mhead .sp{flex:1}
.mhead nav{display:flex;gap:4px;flex-wrap:wrap}
.mhead nav a{font-size:12.5px;color:var(--ink-2);text-decoration:none;padding:5px 9px;border-radius:7px;background:var(--sunk)}
.mhead nav a:hover{background:var(--accent-soft);color:var(--accent)}
dialog.manual article{overflow:auto;flex:1;padding:22px 28px 40px}

/* ---------- celular ---------- */
.grab{display:none}
@media (max-width:820px){
  /* smartphone: mapa em tela cheia e painel deslizante (bottom sheet) por cima */
  body{height:100dvh}
  header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:6px}
  header .btn{padding:9px 11px}
  .brand p{display:none}
  header .btn .lbl{display:none}
  .brand h1 .long{display:none}
  main{position:relative}
  #map{position:absolute;inset:0}
  aside{position:absolute;left:0;right:0;bottom:0;z-index:1100;   /* acima dos controles do Leaflet (z 1000) */width:auto;height:var(--sheet,50%);max-height:100%;
    border:0;border-radius:16px 16px 0 0;box-shadow:0 -4px 22px rgba(10,16,22,.22);transition:height .25s ease;
    padding-bottom:env(safe-area-inset-bottom)}
  aside.arrastando{transition:none}
  .grab{display:flex;justify-content:center;align-items:center;height:22px;flex:none;touch-action:none;cursor:grab}
  .grab span{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.45}
  .summary{padding:2px 16px 10px}
  .summary .eyebrow{display:none}
  .tools{padding:10px 16px}
  .tools input,.tools select{font-size:16px;padding:10px 12px}   /* 16px: o iPhone não dá zoom ao focar */
  .tools input{padding-left:34px}
  .listhead,.row,.dscroll,.dfoot{padding-left:16px;padding-right:16px}
  .row{min-height:52px}
  .kpi{padding:8px 10px}
  .kpi b{font-size:17px}
  .legend{min-width:0}
  /* controles de baixo do mapa (legenda, escala) ficam acima do painel */
  .leaflet-bottom{bottom:var(--sheet-px,0px);transition:bottom .25s ease}
  .leaflet-control-attribution{font-size:10px}
  dialog.manual{width:100%;height:100%;max-height:none;border-radius:0}
  .mhead nav{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .mhead .btn .lbl{display:none}
  dialog.manual article{padding:16px 16px 32px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg></div>
    <div style="min-width:0">
      <h1>GIS Comercial<span class="long"> · Municípios de Pernambuco</span></h1>
      <p>Área urbana IBGE e vias transitáveis dentro das manchas urbanas</p>
    </div>
  </div>
  <div class="sp"></div>
  <button class="btn" id="btnManual" title="Manual de uso">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24H20"/><path d="M8 7h8M8 11h6"/></svg><span class="lbl">Manual</span></button>
  <button class="btn" id="btnDados" title="Baixar os dados (GeoPackage, shapefile, CSV)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span class="lbl">Dados</span></button>
  <button class="btn primary" id="btnGeral" title="Relatório geral (PDF)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="lbl">Relatório geral</span>
  </button>
</header>

<main>
  <aside id="painel">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Expandir ou recolher o painel"><span></span></div>
    <section class="summary">
      <p class="eyebrow">Total na base</p>
      <div class="kpis">
        <div class="kpi"><b class="num" id="kMun">–</b><span>municípios</span></div>
        <div class="kpi"><b class="num" id="kUrb">–</b><span>km² urbanos</span></div>
        <div class="kpi"><b class="num" id="kVias">–</b><span>km de vias transitáveis</span></div>
      </div>
    </section>

    <section class="tools">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar município" aria-label="Buscar município" autocomplete="off">
      </div>
      <label>Indicador
        <select id="metrica">
          <option value="vias">Vias transitáveis (km)</option>
          <option value="urb">Área urbana (km²)</option>
          <option value="dens">Densidade de vias (km/km²)</option>
          <option value="perc">Área urbana / território (%)</option>
        </select>
      </label>
    </section>

    <!-- lista -->
    <div class="view" id="viewList">
      <div class="listhead">
        <span>#</span>
        <button data-k="n">Município</button>
        <button data-k="metric" class="r on" id="hMetric">Vias km ↓</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <!-- detalhe -->
    <div class="view" id="viewDetail" hidden>
      <div class="dscroll" id="detail"></div>
      <div class="dfoot">
        <button class="btn" id="btnZoom">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>Ver no mapa</button>
        <button class="btn primary" id="btnPdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Baixar relatório</button>
      </div>
    </div>
  </aside>
  <div id="map"></div>
</main>

<dialog id="dlg">
  <h3 id="dlgTit">Baixar relatório</h3>
  <p>Escolha qual relatório baixar.</p>
  <label id="optOficial"><input type="radio" name="tipo" value="oficial" checked>
    <span><b>Relatório oficial CONIAPE</b><small id="optOficialTxt"></small></span></label>
  <label><input type="radio" name="tipo" value="gerado">
    <span><b>Relatório do mapa</b><small>Gerado agora: indicadores, distritos e mapa do município.</small></span></label>
  <div class="rowb">
    <button class="btn" id="dlgCancel">Cancelar</button>
    <button class="btn primary" id="dlgOk">Baixar</button>
  </div>
</dialog>
<dialog id="manualDlg" class="manual" aria-labelledby="manualTit">
  <div class="mhead">
    <b id="manualTit">Manual de uso</b>
    <nav id="manualToc" aria-label="Seções do manual"></nav>
    <span class="sp"></span>
    <button class="btn" id="manualPdf" title="Salvar o manual em PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="lbl">Salvar em PDF</span></button>
    <button class="btn ghost" id="manualClose" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <article class="md" id="manualBody"><p class="note">Carregando o manual…</p></article>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Configuração =====
   Onde estão os PDFs oficiais. Vazio = pasta "relatorios/" ao lado deste HTML
   (funciona localmente e no GitHub Pages). Para buscar de outro lugar:
   'https://raw.githubusercontent.com/<usuario>/<repo>/main/relatorios/'          */
const PDF_BASE_URL = '';

const D = window.CONIAPE_DATA;
const fmt = (v, d = 2) => v == null ? '–' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toast = (t, ms = 2500) => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); if (ms) el._t = setTimeout(() => el.classList.remove('on'), ms); };
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_');
const $ = id => document.getElementById(id);

const CO = D.mun.filter(m => m.co);
const byCode = Object.fromEntries(D.mun.map(m => [m.c, m]));
const M = {
  vias: {label: 'Vias transitáveis', unit: 'km', short: 'Vias km', d: 0},
  urb:  {label: 'Área urbana', unit: 'km²', short: 'Área urb. km²', d: 2},
  dens: {label: 'Densidade de vias', unit: 'km/km²', short: 'Densidade', d: 1},
  perc: {label: 'Área urbana / território', unit: '%', short: '% urbano', d: 1},
};
/* posição de cada município em cada indicador (1 = maior); recalculada quando a base cresce */
const RANK = {};
function calcularRanks() {
  Object.keys(RANK).forEach(c => delete RANK[c]);
  Object.keys(M).forEach(k => [...CO].sort((a, b) => b[k] - a[k]).forEach((m, i) => (RANK[m.c] ??= {})[k] = i + 1));
}
function atualizarKpis() {
  $('kMun').textContent = CO.length;
  $('kUrb').textContent = fmt(CO.reduce((s, m) => s + m.urb, 0), 1);
  $('kVias').textContent = fmt(CO.reduce((s, m) => s + m.vias, 0), 0);
}
calcularRanks(); atualizarKpis();
/* abrir um município da base: o base.js troca por uma versão que carrega o detalhe sob demanda */
function abrirMunicipio(cd, zoom = true) { select(cd, zoom); }
function abrirPesquisa() {}   // idem: tela de "gerar dados" para município que ainda não está na base

/* ===== Mapa ===== */
// no celular, zoom só em níveis inteiros: zoom fracionário deixa emendas brancas entre os tiles
const map = L.map('map', {preferCanvas: true, zoomSnap: matchMedia('(max-width: 820px)').matches ? 1 : .5}).setView([-8.3, -36], 8);
const bases = {
  'Cinza claro': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {attribution: '© Esri', maxNativeZoom: 16, maxZoom: 19}),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap', maxZoom: 19}),
  'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution: '© Esri', maxZoom: 19}),
};
bases['Cinza claro'].addTo(map);

let metric = 'vias', breaks = [], selected = null, hovered = null;
const quantBreaks = k => { const v = CO.map(m => m[k]).sort((a, b) => a - b); return [.2, .4, .6, .8].map(q => v[Math.floor(q * (v.length - 1))]); };
const RAMP = ['--c1', '--c2', '--c3', '--c4', '--c5'];
function colorFor(v) { let i = 0; while (i < breaks.length && v > breaks[i]) i++; return css(RAMP[i]); }

function styleMun(f) {
  const m = byCode[f.properties.c];
  if (!m.co) return {color: css('--off-line'), weight: .5, fillColor: css('--off-fill'), fillOpacity: .35};
  const isSel = m.c === selected, isHov = m.c === hovered;
  return {
    color: isSel ? css('--sel') : '#ffffff',
    weight: isSel ? 3 : isHov ? 2.2 : .9,
    fillColor: colorFor(m[metric]),
    // de perto o preenchimento clareia, para aparecerem o mapa base, as manchas e as ruas
    fillOpacity: (selected && !isSel ? .5 : .82) * (map.getZoom() >= 13 ? .2 : map.getZoom() >= 11 ? .45 : 1),
  };
}
const munLayer = L.geoJSON({type: 'FeatureCollection', features: D.mun.map(m => ({type: 'Feature', properties: {c: m.c}, geometry: m.g}))}, {
  style: styleMun,
  onEachFeature: (f, l) => {
    const m = byCode[f.properties.c];
    l.bindTooltip(() => m.co
      ? `<div class="tip"><b>${m.n}</b><br>${M[metric].label}: <b>${fmt(m[metric], M[metric].d)} ${M[metric].unit}</b><br><span>Clique para ver detalhes</span></div>`
      : `<div class="tip"><b>${m.n}</b><br><span>Sem dados · clique para gerar · ${fmt(m.aI, 1)} km²</span></div>`, {sticky: true, direction: 'top', offset: [0, -6]});
    l.on('click', () => m.co ? abrirMunicipio(m.c, true) : abrirPesquisa(m.c));
    // sempre registrado: um município sem dados pode entrar na base depois (m.co passa a true)
    l.on('mouseover', () => { if (!m.co) return; hovered = m.c; l.setStyle(styleMun(f)); l.bringToFront(); if (selected) layerByCode[selected].bringToFront(); });
    l.on('mouseout', () => { if (!m.co) return; hovered = null; l.setStyle(styleMun(f)); });
  },
}).addTo(map);
const layerByCode = {}; munLayer.eachLayer(l => layerByCode[l.feature.properties.c] = l);
const munBounds = {}; CO.forEach(m => munBounds[m.c] = layerByCode[m.c].getBounds());

/* nomes dos municípios da base (aparecem a partir do zoom 9) */
const labels = L.layerGroup(CO.map(m => L.tooltip({permanent: true, direction: 'center', className: 'mlabel', interactive: false})
  .setLatLng(layerByCode[m.c].getCenter()).setContent(m.n)));
let labelsOn = true;   // o usuário pode desligar no controle de camadas
let syncing = false;
const syncLabels = () => { syncing = true; labelsOn && map.getZoom() >= 9 ? labels.addTo(map) : labels.remove(); syncing = false; };

/* só o limite municipal é clicável: áreas urbanas e vias deixam o clique passar */
const urbLayer = L.geoJSON({type: 'FeatureCollection', features: D.urb.map(u => ({type: 'Feature', properties: u, geometry: u.g}))}, {
  interactive: false,
  style: () => ({color: css('--urb'), weight: 1, fillColor: css('--urb'), fillOpacity: .4}),
}).addTo(map);

/* vias: desenhadas sob demanda (zoom ≥ 11 ou município selecionado) */
/* painel próprio sem eventos: o canvas das vias cobre o mapa inteiro e,
   sem isso, engoliria o clique nos outros municípios */
map.createPane('vias');
map.getPane('vias').style.zIndex = 450;
map.getPane('vias').style.pointerEvents = 'none';
const viaRenderer = L.canvas({padding: .3, pane: 'vias'});
const viasGroup = L.layerGroup().addTo(map);
const viaCache = {};
function viaLayer(code) {
  return viaCache[code] ??= L.layerGroup((D.vias[code] || []).map(([, , flat]) => {
    const ll = []; for (let i = 0; i < flat.length; i += 2) ll.push([flat[i + 1], flat[i]]);
    return L.polyline(ll, {renderer: viaRenderer, interactive: false, color: css('--via'), weight: 1.3, opacity: .9});
  }));
}
function refreshVias() {
  if (!map.hasLayer(viasGroup)) return;
  const b = map.getBounds(), z = map.getZoom();
  CO.forEach(m => {
    const want = z >= 11 ? b.intersects(munBounds[m.c]) : m.c === selected;
    const lyr = viaLayer(m.c);
    if (want && !viasGroup.hasLayer(lyr)) viasGroup.addLayer(lyr);
    if (!want && viasGroup.hasLayer(lyr)) viasGroup.removeLayer(lyr);
  });
}
map.on('zoomend', syncLabels);
map.on('zoomend', () => munLayer.setStyle(styleMun));
map.on('moveend zoomend overlayadd', refreshVias);
map.on('overlayremove', e => { if (e.layer === labels && !syncing) labelsOn = false; });
map.on('overlayadd', e => { if (e.layer === labels && !syncing) { labelsOn = true; syncLabels(); } });

L.control.layers(bases, {'Nomes dos municípios': labels, 'Áreas urbanas': urbLayer, 'Vias transitáveis': viasGroup}, {position: 'topright'}).addTo(map);
L.control.scale({imperial: false, position: 'bottomleft'}).addTo(map);

/* legenda recolhível */
const legend = L.control({position: 'bottomright'});
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend' + (innerWidth < 820 ? ' closed' : ''));
  L.DomEvent.disableClickPropagation(div);
  div.innerHTML = `<button class="lh" aria-expanded="true"><span id="lgTitle"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg></button><div class="lb" id="lgBody"></div>`;
  div.querySelector('.lh').onclick = () => div.classList.toggle('closed');
  return div;
};
legend.addTo(map);
function drawLegend() {
  const d = M[metric].d, e = breaks;
  $('lgTitle').textContent = `${M[metric].label} (${M[metric].unit})`;
  $('lgBody').innerHTML = `
    <div class="ramp">${RAMP.map(c => `<i style="background:${css(c)}"></i>`).join('')}</div>
    <div class="ticks num"><span>menor</span>${e.map(v => `<span>${fmt(v, d)}</span>`).join('')}<span>maior</span></div>
    <div class="it"><span class="sw" style="background:${css('--off-fill')};opacity:.6"></span>Sem dados (pesquise para gerar)</div>
    <div class="it"><span class="sw" style="background:${css('--urb')};opacity:.75"></span>Área urbana</div>
    <div class="it"><span class="sw" style="height:3px;background:${css('--via')}"></span>Vias transitáveis (zoom ≥ 11)</div>`;
}

/* ===== Painel deslizante (smartphone) =====
   Três alturas: 'min' (alça + resumo), 'meio' (metade da tela) e 'max'. Arrastar a alça ajusta e
   solta na altura mais próxima; tocar alterna. Os controles de baixo do mapa acompanham (--sheet-px). */
const painel = $('painel'), telaPequena = matchMedia('(max-width: 820px)');
const PEEK = 150;
let sheet = 'meio';
const alturaSheet = est => {
  const H = painel.parentElement.clientHeight;
  return est === 'min' ? Math.min(PEEK, H) : est === 'max' ? H - 6 : Math.round(H * .5);
};
const sheetPx = () => telaPequena.matches ? alturaSheet(sheet) : 0;
function setSheet(est, px) {
  const raiz = document.documentElement.style;
  if (!telaPequena.matches) { painel.style.removeProperty('--sheet'); raiz.setProperty('--sheet-px', '0px'); return; }
  if (est) sheet = est;
  const h = px ?? alturaSheet(sheet);
  painel.style.setProperty('--sheet', h + 'px');
  raiz.setProperty('--sheet-px', Math.min(h, painel.parentElement.clientHeight * .6) + 'px');
}
{
  const grab = $('grab'); let drag = null;
  const proximo = () => setSheet(sheet === 'max' ? 'min' : sheet === 'min' ? 'meio' : 'max');
  grab.addEventListener('pointerdown', e => {
    drag = {y: e.clientY, h: painel.getBoundingClientRect().height, moveu: false};
    painel.classList.add('arrastando'); grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (Math.abs(dy) > 5) drag.moveu = true;
    setSheet(null, Math.max(PEEK * .6, Math.min(alturaSheet('max'), drag.h - dy)));
  });
  const soltar = () => {
    if (!drag) return;
    painel.classList.remove('arrastando');
    if (!drag.moveu) proximo();
    else {
      const h = painel.getBoundingClientRect().height;
      setSheet(['min', 'meio', 'max'].reduce((a, b) => Math.abs(alturaSheet(a) - h) <= Math.abs(alturaSheet(b) - h) ? a : b));
    }
    drag = null;
  };
  grab.addEventListener('pointerup', soltar);
  grab.addEventListener('pointercancel', soltar);
  grab.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); proximo(); } });
  addEventListener('resize', () => setSheet());
  telaPequena.addEventListener('change', () => setSheet());
  setSheet('meio');
}
/* enquadra deixando de fora a parte do mapa coberta pelo painel */
const enquadrar = (bounds, extra = {}) => map.fitBounds(bounds, {paddingTopLeft: [24, 24], paddingBottomRight: [24, 24 + sheetPx()], ...extra});

/* enquadramento inicial: espera o painel ter tamanho real */
const allBounds = L.latLngBounds(CO.map(m => munBounds[m.c]).flatMap(b => [b.getSouthWest(), b.getNorthEast()]));
const fitAll = () => { map.invalidateSize(); enquadrar(allBounds, {maxZoom: 10}); };
let userMoved = false;
const markMoved = () => { userMoved = true; };
map.on('dragstart', markMoved);
map.getContainer().addEventListener('wheel', markMoved, {passive: true});
new ResizeObserver(([e]) => { if (e.contentRect.width > 50 && e.contentRect.height > 50 && !userMoved && !selected) fitAll(); }).observe(map.getContainer());

/* ===== Lista ===== */
let sortK = 'metric', sortDir = -1;
function renderList() {
  const q = slug($('busca').value.toLowerCase());
  const max = Math.max(...CO.map(m => m[metric]));
  const rows = CO.filter(m => slug(m.n.toLowerCase()).includes(q))
    .sort((a, b) => sortK === 'n' ? a.n.localeCompare(b.n) * sortDir : (a[metric] - b[metric]) * sortDir);
  $('hMetric').textContent = M[metric].short + (sortK === 'metric' ? (sortDir < 0 ? ' ↓' : ' ↑') : '');
  document.querySelector('.listhead [data-k="n"]').textContent = 'Município' + (sortK === 'n' ? (sortDir > 0 ? ' ↓' : ' ↑') : '');
  $('list').innerHTML = rows.length ? rows.map(m => `
    <button class="row" data-c="${m.c}">
      <span class="rk num">${RANK[m.c][metric]}º</span>
      <span class="nm">${m.n}<small>${metric === 'vias' ? fmt(m.urb) + ' km² urbanos' : fmt(m.vias, 0) + ' km de vias'}</small></span>
      <span class="val num">${fmt(m[metric], M[metric].d)}<div class="bar"><i style="width:${(m[metric] / max * 100).toFixed(1)}%;background:${colorFor(m[metric])}"></i></div></span>
    </button>`).join('') : `<div class="empty">Nenhum município da base com esse nome.${window.GC_CONFIG?.supabaseUrl ? ' Veja as sugestões abaixo da busca para gerar os dados.' : ''}</div>`;
}
$('list').onclick = e => { const r = e.target.closest('.row'); if (r) abrirMunicipio(r.dataset.c, true); };
$('list').onmouseover = e => { const r = e.target.closest('.row'); const c = r?.dataset.c ?? null; if (c !== hovered) { const old = hovered; hovered = c; [old, c].forEach(k => k && layerByCode[k].setStyle(styleMun(layerByCode[k].feature))); } };
$('list').onmouseleave = () => { const old = hovered; hovered = null; if (old) layerByCode[old].setStyle(styleMun(layerByCode[old].feature)); };
$('busca').oninput = () => { if (selected) closeDetail(); renderList(); };
$('busca').onfocus = () => { if (telaPequena.matches) setSheet('max'); };   // teclado aberto: lista inteira à vista
document.querySelectorAll('.listhead button').forEach(b => b.onclick = () => {
  const k = b.dataset.k; sortDir = sortK === k ? -sortDir : (k === 'n' ? 1 : -1); sortK = k;
  document.querySelectorAll('.listhead button').forEach(x => x.classList.toggle('on', x === b)); renderList();
});

function setMetric(k) { metric = k; breaks = quantBreaks(k); munLayer.setStyle(styleMun); drawLegend(); renderList(); if (selected) renderDetail(byCode[selected]); }
$('metrica').onchange = e => setMetric(e.target.value);
setMetric('vias');

/* ===== Detalhe ===== */
function select(code, zoom) {
  const prev = selected; selected = code;
  if (prev !== code) limparMancha();
  if (telaPequena.matches) setSheet('meio');   // metade da tela: detalhe embaixo, município visível em cima
  munLayer.setStyle(styleMun); layerByCode[code].bringToFront();
  if (zoom) flyTo(code);
  refreshVias();
  renderDetail(byCode[code]);
  $('viewList').hidden = true; $('viewDetail').hidden = false;
  document.querySelector('aside').classList.add('detail-open');
  if (prev !== code) $('detail').scrollTop = 0;
}
function closeDetail() {
  selected = null; limparMancha(); munLayer.setStyle(styleMun); refreshVias();
  if (typeof limparPesquisa === 'function') limparPesquisa();
  $('viewDetail').hidden = true; $('viewList').hidden = false;
  document.querySelector('aside').classList.remove('detail-open');
}
function renderDetail(m) {
  const dist = D.distritos.filter(d => d.CD_MUN === m.c).sort((a, b) => b.vias_km - a.vias_km);
  const maxV = Math.max(...dist.map(d => d.vias_km), 1);
  const n = CO.length;
  $('detail').innerHTML = `
    <div class="dtop"><button class="btn ghost" id="btnBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Todos os municípios</button></div>
    <div class="dtitle"><h2>${m.n}${m.uf ? ' · ' + m.uf : ''}</h2>
      <p><span class="chip ${m.origem === 'pesquisa' ? 'pesq' : ''}">${m.origem === 'pesquisa' ? 'Pesquisa' : 'CONIAPE'}</span>
        Código IBGE ${m.c}<br>${m.rgi ? `Região imediata de ${m.rgi}` : ''}${m.rgint ? ` · Região intermediária de ${m.rgint}` : ''}</p></div>
    <div class="hero">
      <div><span>Área urbana</span><b class="num">${fmt(m.urb)} km²</b><small>${RANK[m.c].urb}º de ${n} na base</small></div>
      <div><span>Vias transitáveis</span><b class="num">${fmt(m.vias)} km</b><small>${RANK[m.c].vias}º de ${n} na base</small></div>
    </div>
    ${m.rev?.motivo ? `<div class="alert"><b>Atenção:</b> ${m.rev.motivo} O valor atual vem de nova extração do OpenStreetMap.</div>` : ''}
    ${typeof cartaoFontes === 'function' ? cartaoFontes(m) : ''}
    <div class="stats">
      <div><span>Vias – critério CONIAPE original</span><b class="num">${m.rev ? fmt(m.rev.orig) + ' km' : '–'}</b></div>
      <div><span>Não transitáveis excluídas</span><b class="num">${(m.excl || m.rev?.excl) ? fmt(Object.values(m.excl || m.rev.excl).reduce((a, b) => a + b, 0)) + ' km' : '–'}</b></div>
      <div><span>Densidade de vias</span><b class="num">${fmt(m.dens)} km/km²</b></div>
      <div><span>Área urbana / território</span><b class="num">${fmt(m.perc)} %</b></div>
      <div><span>Território (área oficial IBGE)</span><b class="num">${fmt(m.aI, 1)} km²</b></div>
      <div><span>Território (planimétrica UTM ${m.zona ?? 25}S)</span><b class="num">${fmt(m.aU, 1)} km²</b></div>
      <div><span>Setores urbanos</span><b class="num">${m.set ?? '–'}</b></div>
      <div><span>Distritos / manchas</span><b class="num">${m.dist ?? '–'}</b></div>
    </div>
    ${dist.length ? `<h3>Distritos e manchas urbanas</h3>
    <table class="dist num"><thead><tr><th>Nome</th><th>Área km²</th><th>Vias km</th></tr></thead><tbody>
      ${dist.map(d => `<tr data-mancha="${encodeURIComponent(d.distrito)}" tabindex="0" title="Aproximar ${d.distrito} no mapa">
        <td><svg class="zi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4M11 8.5v5M8.5 11h5"/></svg>${d.distrito}</td>
        <td>${fmt(d.area_km2)}</td><td>${fmt(d.vias_km)}<div class="bar"><i style="width:${(d.vias_km / maxV * 100).toFixed(1)}%"></i></div></td></tr>`).join('')}
    </tbody>${dist.length > 1 ? `<tfoot><tr><td>Total</td><td>${fmt(dist.reduce((s, d) => s + d.area_km2, 0))}</td><td>${fmt(dist.reduce((s, d) => s + d.vias_km, 0))}</td></tr></tfoot>` : ''}</table>` : ''}
    ${dist.length ? '<p class="note">Toque numa mancha para aproximar o mapa nela; toque de novo para voltar ao município.</p>' : ''}
    <p class="note">Fonte: ${m.fonte}. ${m.pdf ? '' : 'Este município não tem relatório oficial; o PDF é gerado pelo mapa.'}</p>`;
  $('btnBack').onclick = closeDetail;
  marcarManchas();
}

/* ===== Zoom numa mancha urbana (linhas da tabela de distritos) ===== */
map.createPane('destaque');
map.getPane('destaque').style.zIndex = 455;
map.getPane('destaque').style.pointerEvents = 'none';
const destaqueMancha = L.layerGroup().addTo(map);
let manchaSel = null;
/* polígonos da mancha: pelo nome; município de mancha única cai no único polígono que tiver */
function poligonosMancha(cd, nome) {
  const doMun = urbLayer.getLayers().filter(l => l.feature.properties.c === cd);
  const porNome = doMun.filter(l => l.feature.properties.n === nome);
  return porNome.length ? porNome : new Set(doMun.map(l => l.feature.properties.n)).size === 1 ? doMun : [];
}
function desenharDestaque(camadas = []) {
  destaqueMancha.clearLayers();
  camadas.forEach(l => L.geoJSON(l.feature, {pane: 'destaque', interactive: false,
    style: {color: css('--sel'), weight: 3, dashArray: '7 5', fill: false}}).addTo(destaqueMancha));
}
function marcarManchas() {
  document.querySelectorAll('#detail tr[data-mancha]').forEach(tr =>
    tr.classList.toggle('sel', decodeURIComponent(tr.dataset.mancha) === manchaSel));
}
function zoomMancha(nome) {
  if (!selected) return;
  if (manchaSel === nome) {   // segundo toque: volta ao município inteiro
    manchaSel = null; desenharDestaque(); marcarManchas(); flyTo(selected); return;
  }
  const camadas = poligonosMancha(selected, nome);
  if (!camadas.length) { toast('Não achei o polígono desta mancha no mapa'); return; }
  manchaSel = nome; desenharDestaque(camadas); marcarManchas();
  document.querySelector('#detail tr.sel')?.scrollIntoView({block: 'nearest'});
  const b = L.latLngBounds([]); camadas.forEach(l => b.extend(l.getBounds()));
  const s = map.getSize(), pad = {paddingTopLeft: [40, 40], paddingBottomRight: [40, 40 + sheetPx()], maxZoom: 16};
  s.x > 0 && s.y > 0 ? map.flyToBounds(b, {...pad, duration: .6}) : map.fitBounds(b, pad);
}
const limparMancha = () => { manchaSel = null; desenharDestaque(); };
$('detail').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-mancha]'); if (tr) zoomMancha(decodeURIComponent(tr.dataset.mancha));
});
$('detail').addEventListener('keydown', e => {
  const tr = e.target.closest('tr[data-mancha]');
  if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); zoomMancha(decodeURIComponent(tr.dataset.mancha)); }
});
/* flyTo quebra (NaN) com o mapa sem tamanho, p.ex. aba em segundo plano: aí só enquadra */
function flyTo(code) {
  const s = map.getSize(), pad = {paddingTopLeft: [30, 30], paddingBottomRight: [30, 30 + sheetPx()]};
  s.x > 0 && s.y > 0 ? map.flyToBounds(munBounds[code], {...pad, duration: .6}) : map.fitBounds(munBounds[code], pad);
}
$('btnZoom').onclick = () => selected && flyTo(selected);
$('btnPdf').onclick = () => selected && askDownload(byCode[selected]);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected && !document.querySelector('dialog[open]')) closeDetail(); });

/* ===== Download ===== */
const dlg = $('dlg');
function askDownload(m) {
  $('dlgTit').textContent = `Relatório · ${m.n}`;
  const has = !!m.pdf, opt = $('optOficial');
  opt.querySelector('input').disabled = !has; opt.style.opacity = has ? 1 : .5;
  $('optOficialTxt').textContent = !has ? 'Não há relatório oficial para este município.'
    : m.rev ? `PDF original do município. Atenção: traz o km de vias pelo critério antigo do CONIAPE (${fmt(m.rev.orig)} km).`
    : 'PDF original do município, baixado do repositório.';
  dlg.querySelector(`input[value="${has ? 'oficial' : 'gerado'}"]`).checked = true;
  dlg.showModal();
  $('dlgOk').onclick = async () => {
    const tipo = dlg.querySelector('input[name=tipo]:checked').value; dlg.close();
    tipo === 'oficial' ? await baixarOficial(m) : await gerarPdfMunicipio(m).catch(pdfErro);
  };
}
$('dlgCancel').onclick = () => dlg.close();

async function baixarOficial(m) {
  const url = (PDF_BASE_URL || 'relatorios/') + encodeURIComponent(m.pdf);
  toast('Baixando relatório…', 0);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: m.pdf});
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Relatório baixado');
  } catch (e) {
    // file:// bloqueia fetch local: abre o arquivo direto
    toast('Abrindo o PDF…'); window.open(url, '_blank');
  }
}
</script>

<script>
const pdfErro = e => { console.error(e); toast('Não foi possível gerar o PDF: ' + e.message, 5000); };
$('btnGeral').onclick = () => gerarPdfGeral().catch(pdfErro);

/* ===== Manual (janela) ===== */
const manualDlg = $('manualDlg');
let manualPronto = null;
function abrirManual(secao) {
  manualDlg.showModal();
  manualPronto ??= renderManual($('manualBody'), {toc: $('manualToc'), rolagem: $('manualBody')})
    .catch(() => { manualPronto = null;
      $('manualBody').innerHTML = `<p>Não foi possível carregar o manual aqui.
        <a href="https://github.com/montieur/gis-comercial/blob/main/MANUAL.md" target="_blank" rel="noopener">Abrir no GitHub</a>.</p>`; });
  manualPronto?.then(() => secao ? irParaManual($('manualBody'), secao, $('manualBody')) : $('manualBody').scrollTo(0, 0));
}
$('btnManual').onclick = () => abrirManual();
$('btnDados').onclick = () => abrirManual('parte-3-baixar-os-dados');
$('manualClose').onclick = () => manualDlg.close();
manualDlg.addEventListener('click', e => { if (e.target === manualDlg) manualDlg.close(); });   // clique fora fecha
$('manualPdf').onclick = () => {
  const a = Object.assign(document.createElement('a'), {href: 'dados/Manual_GIS_Comercial.pdf', download: 'Manual_GIS_Comercial.pdf'});
  document.body.appendChild(a); a.click(); a.remove();
};

/* ===== Estado pela URL (links compartilháveis):
   ?mun=<código IBGE>[&zoom=<nível>][&mancha=<nome>]  ?ind=vias|urb|dens|perc  ?baixar  ?manual[=<seção>]
   ?painel=min|meio|max (smartphone) ===== */
{
  const P = new URLSearchParams(location.search);
  if (['min', 'meio', 'max'].includes(P.get('painel'))) setSheet(P.get('painel'));
  if (M[P.get('ind')]) { $('metrica').value = P.get('ind'); setMetric(P.get('ind')); }
  const cd = P.get('mun');
  if (cd && byCode[cd]?.co) {
    select(cd, false);
    const z = +P.get('zoom');
    z ? map.setView(layerByCode[cd].getCenter(), z) : enquadrar(munBounds[cd]);
  }
  if (P.get('mancha') && selected) zoomMancha(P.get('mancha'));
  if (P.has('baixar') && selected) askDownload(byCode[selected]);
  if (P.has('manual')) abrirManual(P.get('manual') || undefined);
}
