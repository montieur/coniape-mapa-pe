<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moldura de celular (prints do manual)</title>
<style>
/* Usada só por capturar_prints.py: o Edge headless não abre janela estreita como um celular,
   então o mapa roda num iframe de 390 x 844 px dentro desta moldura. */
html,body{margin:0;height:100%;background:#e8ecf0}
body{display:grid;place-items:center}
.aparelho{width:390px;height:844px;border:12px solid #12171c;border-radius:46px;overflow:hidden;
  box-shadow:0 18px 40px rgba(10,16,22,.25);background:#000}
iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="aparelho"><iframe id="f" title="Mapa no celular"></iframe></div>
<script>document.getElementById('f').src = '../' + (new URLSearchParams(location.search).get('src') || '');</script>
</body>
</html>
