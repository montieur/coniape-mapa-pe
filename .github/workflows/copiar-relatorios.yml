name: Copiar relatórios PDF para o Drive

# Cópia de segurança dos relatórios oficiais (relatorios/*.pdf) na pasta "GIS Comercial / Relatórios" do Drive.
# Roda só quando chamado à mão (Actions > Copiar relatórios PDF para o Drive > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - working-directory: worker
        run: python -u enviar_relatorios.py
