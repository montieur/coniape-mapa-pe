name: Processar fila do GIS Comercial

# Processa a fila do mapa: gera municípios, atualiza e confere as fontes (OpenStreetMap). Roda a cada 5 minutos
# (e na hora, se a função gc-solicitar tiver o segredo GITHUB_DISPATCH_TOKEN). Sem pedido na fila, termina em
# segundos sem instalar nada.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      refazer_pdfs:
        description: "Refazer o relatório PDF de todos os municípios da base e enviar ao Drive"
        type: boolean
        default: false

concurrency:
  group: gc-fila
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
      GC_MAX_PEDIDOS: "20"
      GC_LISTA_PDF: ${{ github.workspace }}/pdfs_pendentes.txt
    steps:
      - name: Configurado?
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Segredos SUPABASE_URL / SUPABASE_SERVICE_KEY ainda não configurados; nada a fazer."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Há pedido na fila?
        id: fila
        if: steps.cfg.outputs.ok == '1'
        run: |
          n=$(curl -sf "$SUPABASE_URL/rest/v1/gc_pedidos?select=id&status=in.(fila,processando)&limit=1" \
                -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | python3 -c 'import sys, json; print(len(json.load(sys.stdin)))')
          echo "Pedidos ativos: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: (steps.fila.outputs.n != '0' || inputs.refazer_pdfs) && steps.cfg.outputs.ok == '1'

      - uses: actions/setup-python@v5
        if: (steps.fila.outputs.n != '0' || inputs.refazer_pdfs) && steps.cfg.outputs.ok == '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependências
        if: (steps.fila.outputs.n != '0' || inputs.refazer_pdfs) && steps.cfg.outputs.ok == '1'
        run: pip install -r worker/requirements.txt

      - name: Cache dos setores do IBGE
        if: (steps.fila.outputs.n != '0' || inputs.refazer_pdfs) && steps.cfg.outputs.ok == '1'
        uses: actions/cache@v4
        with:
          path: worker/.cache
          key: setores-ibge-${{ github.run_id }}
          restore-keys: setores-ibge-

      - name: Processar pedidos
        if: (steps.fila.outputs.n != '0' || inputs.refazer_pdfs) && steps.cfg.outputs.ok == '1'
        working-directory: worker
        run: python -u processar_fila.py

      - name: Relatórios PDF no Drive (municípios com dados novos)
        if: always() && steps.cfg.outputs.ok == '1' && (steps.fila.outputs.n != '0' || inputs.refazer_pdfs)
        continue-on-error: true
        working-directory: worker
        run: |
          pip install -q playwright
          if [ "${{ inputs.refazer_pdfs }}" = "true" ]; then
            python -u relatorio_pdf.py --todos
          elif [ -s "$GC_LISTA_PDF" ]; then
            python -u relatorio_pdf.py "$GC_LISTA_PDF"
          else
            echo "Nenhum município com dados novos nesta rodada."
          fi
